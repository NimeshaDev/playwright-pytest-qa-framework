name: Playwright Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/api --html=reports/api-report.html --self-contained-html

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/

  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ${{ matrix.browser }}
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI and BDD tests on ${{ matrix.browser }}
        run: >
          pytest tests/ui
          --browser ${{ matrix.browser }}
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results
          --html=reports/ui-report-${{ matrix.browser }}.html
          --self-contained-html

      - name: Upload ${{ matrix.browser }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.browser }}
          path: |
            reports/
            test-results/

  publish-report:
    if: always() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: [ api-tests, ui-tests ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build report site
        run: |
          mkdir -p site
          find artifacts -name '*.html' -exec cp {} site/ \;
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Test Reports - Playwright + pytest QA Framework</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;color:#1f2328}'
            echo 'a{color:#0969da}li{margin:8px 0}.meta{color:#59636e;font-size:14px}</style></head><body>'
            echo '<h1>Latest test reports</h1>'
            echo '<p>Automated tests for the <a href="https://www.saucedemo.com">Sauce Demo</a> shop and a public REST API, written in Python with Playwright and pytest. The UI suite covers login (valid, invalid and locked-out users), adding to cart and the full login-to-cart flow, using the Page Object Model and Gherkin BDD scenarios. It runs on Chromium, Firefox and WebKit. The API suite checks status codes (200, 201, 404) and response data for GET and POST requests.</p>'
            echo '<p>Every push to <code>master</code> runs all tests in GitHub Actions and republishes these reports.</p>'
            echo "<p class=\"meta\">Commit ${GITHUB_SHA::7} &middot; $(date -u '+%d %b %Y %H:%M UTC') &middot; <a href=\"$RUN_URL\">CI run</a></p><ul>"
            for f in site/api-report.html site/ui-report-chromium.html site/ui-report-firefox.html site/ui-report-webkit.html; do
              [ -f "$f" ] || continue
              n=$(basename "$f" .html)
              case "$n" in
                api-report) label="API tests";;
                ui-report-*) label="UI + BDD tests - ${n#ui-report-}";;
              esac
              echo "<li><a href=\"$(basename "$f")\">$label</a></li>"
            done
            echo '</ul><p class="meta"><a href="${{ github.server_url }}/${{ github.repository }}">Source code on GitHub</a></p></body></html>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

name: Playwright Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/api --html=reports/api-report.html --self-contained-html

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/

  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ${{ matrix.browser }}
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI and BDD tests on ${{ matrix.browser }}
        run: >
          pytest tests/ui
          --browser ${{ matrix.browser }}
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results
          --html=reports/ui-report-${{ matrix.browser }}.html
          --self-contained-html

      - name: Upload ${{ matrix.browser }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.browser }}
          path: |
            reports/
            test-results/
